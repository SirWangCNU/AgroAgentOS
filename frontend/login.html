<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AgroAgentOS 智农协同平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-green: #22c55e;
            --dark-green: #15803d;
            --light-green: #86efac;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景动画粒子 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-green);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-30px) translateX(15px); }
            50% { transform: translateY(-15px) translateX(-10px); }
            75% { transform: translateY(-45px) translateX(20px); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
        }

        .logo-icon i {
            font-size: 28px;
            color: white;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus {
            border-color: var(--primary-green);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #86efac;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="bg-particles">
        <div class="particle" style="left: 10%; top: 20%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; top: 80%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; top: 40%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; top: 70%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 80%; top: 30%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 90%; top: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 30%; top: 10%; animation-delay: 2.5s;"></div>
        <div class="particle" style="left: 70%; top: 90%; animation-delay: 1.5s;"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo 部分 -->
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-seedling"></i>
                </div>
                <h1 class="logo-title">AgroAgentOS</h1>
                <p class="logo-subtitle">智农协同平台</p>
            </div>

            <!-- 标签切换 -->
            <div class="tab-switcher">
                <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
                    <i class="fas fa-sign-in-alt mr-2"></i>登录
                </button>
                <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
                    <i class="fas fa-user-plus mr-2"></i>注册
                </button>
            </div>

            <!-- 错误提示 -->
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="error-text"></span>
            </div>

            <!-- 成功提示 -->
            <div id="success-message" class="success-message">
                <i class="fas fa-check-circle mr-2"></i>
                <span id="success-text"></span>
            </div>

            <!-- 登录表单 -->
            <div id="login-form" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-user form-input-icon"></i>
                            <input type="text" class="form-input" id="login-username"
                                   placeholder="请输入用户名" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-lock form-input-icon"></i>
                            <input type="password" class="form-input" id="login-password"
                                   placeholder="请输入密码" required autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="login-btn">
                        <i class="fas fa-sign-in-alt mr-2"></i>登 录
                    </button>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-user form-input-icon"></i>
                            <input type="text" class="form-input" id="reg-username"
                                   placeholder="3-64个字符" required minlength="3" maxlength="64" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-envelope form-input-icon"></i>
                            <input type="email" class="form-input" id="reg-email"
                                   placeholder="请输入邮箱" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-lock form-input-icon"></i>
                            <input type="password" class="form-input" id="reg-password"
                                   placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('reg-password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-lock form-input-icon"></i>
                            <input type="password" class="form-input" id="reg-confirm-password"
                                   placeholder="请再次输入密码" required autocomplete="new-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('reg-confirm-password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="register-btn">
                        <i class="fas fa-user-plus mr-2"></i>注 册
                    </button>
                </form>
            </div>

            <div class="footer-text">
                <i class="fas fa-leaf mr-1"></i>智能农业，科技兴农
            </div>
        </div>
    </div>

    <script>
        // 检查是否已登录
        const token = localStorage.getItem('agro_token');
        if (token) {
            window.location.href = '/index.html';
        }

        // 切换标签
        function switchTab(tab) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            // 更新表单显示
            document.getElementById('login-form').classList.toggle('active', tab === 'login');
            document.getElementById('register-form').classList.toggle('active', tab === 'register');

            // 清除错误和成功消息
            hideMessages();
        }

        // 显示错误消息
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('success-message').classList.remove('show');
        }

        // 显示成功消息
        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            successText.textContent = message;
            successEl.classList.add('show');
            document.getElementById('error-message').classList.remove('show');
        }

        // 隐藏所有消息
        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        // 切换密码可见性
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // 设置按钮加载状态
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<span class="loading-spinner"></span>处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText;
            }
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            setLoading('login-btn', true);

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.code === 'SUCCESS') {
                    // 保存 token 和用户信息
                    localStorage.setItem('agro_token', data.data.access_token);
                    localStorage.setItem('agro_user', JSON.stringify(data.data.user));

                    showSuccess('登录成功，正在跳转...');

                    // 延迟跳转
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 500);
                } else {
                    showError(data.message || '登录失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                console.error('登录错误:', error);
            } finally {
                setLoading('login-btn', false);
            }
        }

        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            hideMessages();

            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            // 验证密码
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            setLoading('register-btn', true);

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (data.code === 'SUCCESS') {
                    showSuccess('注册成功，请登录');

                    // 切换到登录标签并预填用户名
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('login-username').value = username;
                        document.getElementById('login-password').focus();
                    }, 1000);
                } else {
                    showError(data.message || '注册失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                console.error('注册错误:', error);
            } finally {
                setLoading('register-btn', false);
            }
        }

        // 回车键提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.form-section.active form');
                if (activeForm) {
                    activeForm.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
